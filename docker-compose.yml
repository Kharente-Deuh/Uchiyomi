name: uchiyomi

services:
  uchiyomi-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-uchiyomi}
      POSTGRES_PASSWORD: ${DB_PWD:-uchiyomi}
      POSTGRES_DB: ${DB_NAME:-uchiyomi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_EXPOSED_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-uchiyomi} -d ${DB_NAME:-uchiyomi}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  server:
    build: .
    restart: unless-stopped
    depends_on:
      uchiyomi-db:
        condition: service_healthy
    ports:
      - "${API_EXPOSED_PORT:-3000}:3000"
    environment:
      GOMEMLIMIT: 450MiB
      GOMAXPROCS: "2"
      DB_HOST: uchiyomi-db
      DB_PORT: 5432
      PUID: ${PUID:-65532}
      PGID: ${PGID:-65532}
      DB_USER: ${DB_USER:-uchiyomi}
      DB_PWD: ${DB_PWD:-uchiyomi}
      DB_NAME: ${DB_NAME:-uchiyomi}
      DB_SSL: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      CHAPTER_DOWNLOAD_RATE_LIMIT: ${CHAPTER_DOWNLOAD_RATE_LIMIT:-500ms}
      OIDC_ENCRYPTION_KEY: "${OIDC_ENCRYPTION_KEY:?set OIDC_ENCRYPTION_KEY, e.g. openssl rand -base64 32}"
    healthcheck:
      test: ["CMD", "/uchiyomiserver", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    read_only: true
    volumes:
      - ./.data:/data
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M    
        reservations:
          cpus: "0.25"
          memory: 128M

  challenge-solver:
    image: ghcr.io/thephaseless/byparr:latest
    restart: unless-stopped
    ports:
      - "${CHALLENGE_SOLVER_EXPOSED_PORT:-8191}:8191"

volumes:
  pgdata:
